name: Frontend Zvuchno deploy

concurrency:
  group: deploy
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./
          push: true
          build-args: |
            NEXT_PUBLIC_BASE_API_URL=${{ secrets.NEXT_PUBLIC_BASE_API_URL }}
            NEXT_PUBLIC_YANDEX_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_YANDEX_MAPS_API_KEY }}
            NEXT_PUBLIC_DADATA_API_KEY=${{ secrets.NEXT_PUBLIC_DADATA_API_KEY }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/zvuchno_frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/zvuchno_frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: SSH deploy frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            CUR_UID=$(id -u)
            CUR_GID=$(id -g)
            export DOCKER_HOST=unix:///run/user/$CUR_UID/docker.sock

            export UID=$CUR_UID
            export GID=$CUR_GID

            cd zvuchno

            docker compose -f docker-compose.production.yml pull frontend
            docker compose -f docker-compose.production.yml up -d frontend

            docker image prune -f
